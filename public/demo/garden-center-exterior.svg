    <rect x="-4" y="-46" width="8" height="46" fill="#4c7a5c"/>
    <ellipse cx="0" cy="-48" rx="24" ry="16" fill="#0a5c4e"/>
  </g>

  <!-- outdoor display racks with small pots -->
