<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eafaf3"/>
      <stop offset="100%" stop-color="#cdeee0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg4)"/>

  <!-- wooden bench surface -->
  <rect x="0" y="560" width="800" height="240" fill="#8a6f52"/>
  <g stroke="#6e5540" stroke-width="4" opacity="0.5">
    <line x1="0" y1="620" x2="800" y2="620"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
  </g>

  <!-- seedling tray, 3x2 cells -->
  <rect x="140" y="470" width="520" height="150" rx="10" fill="#4c7a5c"/>
  <g fill="#3a6249">
    <rect x="160" y="490" width="150" height="110" rx="6"/>
    <rect x="325" y="490" width="150" height="110" rx="6"/>
    <rect x="490" y="490" width="150" height="110" rx="6"/>
  </g>

  <!-- seedlings poking up from each cell -->
  <g stroke="#0a5c4e" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M235 490 L235 430"/>
    <path d="M400 490 L400 420"/>
    <path d="M565 490 L565 435"/>
  </g>
  <g fill="#2fbfa4">
    <ellipse cx="215" cy="425" rx="24" ry="14" transform="rotate(-25 215 425)"/>
    <ellipse cx="255" cy="425" rx="24" ry="14" transform="rotate(25 255 425)"/>
    <ellipse cx="380" cy="415" rx="26" ry="15" transform="rotate(-25 380 415)"/>
    <ellipse cx="420" cy="415" rx="26" ry="15" transform="rotate(25 420 415)"/>
    <ellipse cx="545" cy="430" rx="24" ry="14" transform="rotate(-25 545 430)"/>
    <ellipse cx="585" cy="430" rx="24" ry="14" transform="rotate(25 585 430)"/>
  </g>

  <!-- watering can pouring from upper right -->
  <g transform="translate(560,150) rotate(20)">
    <path d="M0 60 L170 60 L170 120 Q170 150 140 150 L20 150 Q0 150 0 120 Z" fill="#0ea895"/>
    <rect x="150" y="30" width="20" height="40" rx="8" fill="#0ea895"/>
    <path d="M168 40 L260 70 L255 86 L163 58 Z" fill="#0ea895"/>
    <path d="M40 10 Q90 -40 130 10" stroke="#0a2420" stroke-width="10" fill="none"/>
  </g>

  <!-- water droplets -->
  <g fill="#7ec9e8" opacity="0.85">
    <ellipse cx="300" cy="270" rx="6" ry="10"/>
    <ellipse cx="330" cy="310" rx="5" ry="9"/>
    <ellipse cx="360" cy="260" rx="6" ry="10"/>
    <ellipse cx="315" cy="350" rx="5" ry="8"/>
  </g>

  <!-- small potted plant to the side for context -->
  <g transform="translate(100,700)">
    <path d="M-26 0 L26 0 L18 48 L-18 48 Z" fill="#c17a4f"/>
    <ellipse cx="0" cy="-16" rx="30" ry="28" fill="#0d9488"/>
    <ellipse cx="-14" cy="-30" rx="18" ry="16" fill="#2fbfa4"/>
    <ellipse cx="14" cy="-24" rx="16" ry="16" fill="#86e6b0"/>
  </g>
</svg>
