<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eafaf3"/>
      <stop offset="100%" stop-color="#cdeee0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8cdb8"/>
      <stop offset="100%" stop-color="#c4b79f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- greenhouse roof structure -->
  <g stroke="#0a2420" stroke-width="3" opacity="0.5" fill="none">
    <path d="M0 90 L400 10 L800 90"/>
    <path d="M0 130 L400 50 L800 130"/>
    <line x1="80" y1="105" x2="80" y2="500"/>
    <line x1="240" y1="65" x2="240" y2="500"/>
    <line x1="400" y1="15" x2="400" y2="500"/>
    <line x1="560" y1="65" x2="560" y2="500"/>
    <line x1="720" y1="105" x2="720" y2="500"/>
  </g>

  <!-- floor -->
  <rect x="0" y="360" width="800" height="140" fill="url(#floor)"/>
  <g stroke="#b3a58a" stroke-width="2" opacity="0.6">
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="470" x2="800" y2="470"/>
  </g>

  <!-- staging table -->
