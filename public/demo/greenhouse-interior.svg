      <ellipse cx="-8" cy="-10" rx="20" ry="20" fill="#0d9488"/>
      <ellipse cx="12" cy="-18" rx="18" ry="18" fill="#86e6b0"/>
      <ellipse cx="0" cy="-30" rx="12" ry="14" fill="#2fbfa4"/>
